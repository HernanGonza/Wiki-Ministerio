        # ── Wiki MERNR ── (pegar dentro del server { } de ecodatos/infra/nginx/nginx.conf)
        location = /wiki { return 301 /wiki/; }

        location ^~ /wiki/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $wiki http://wiki-web:80;
            rewrite ^/wiki/(.*)$ /$1 break;
            proxy_pass $wiki;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 26m;
            proxy_read_timeout 60s;
        }

        # ── Vaultwarden ── (corre en el host, puerto 4444; DOMAIN debe terminar en /claves)
        # Acá NO se saca el prefijo: Vaultwarden con DOMAIN=https://…/claves ya atiende bajo /claves.
        location = /claves { return 301 /claves/; }

        location ^~ /claves/ {
            proxy_pass http://10.0.0.231:4444;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # notificaciones en vivo (websocket)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            client_max_body_size 525M;   # adjuntos
            proxy_read_timeout 300s;
        }
